#{extends 'main.html' /}
#{set title: 'Cadastrar Turma - Sistema Escolar' /}

<section class="card">
    <div class="card-header">
        <h2>Nova Turma</h2>
    </div>

    <form action="@{Turmas.salvar()}" method="POST" class="form-grid">
        <!-- Campo Oculto para ID (Edição) -->
        <input type="hidden" name="t.id" value="${t?.id}" />

        <!-- Nome da Turma -->
        <div class="form-group">
            <label for="nome">Nome da Turma</label>
            <input type="text" id="nome" name="t.nome" value="${t?.nome}" placeholder="Ex: Informática 1M"
                required />
        </div>

        <!-- Ações do Formulário -->
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar Turma</button>
            <a href="@{Turmas.listar()}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</section>
