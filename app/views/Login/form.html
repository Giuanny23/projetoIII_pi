#{extends 'main.html' /}
#{set title:'Login - Sistema Escolar' /}

<div class="login-wrapper">
    <section class="card login-card">
        <div class="card-header text-center">
            <h2>Acessar o Sistema</h2>
            <p class="subtitle">Informe suas credenciais para continuar</p>
        </div>

        <form action="@{Login.login()}" method="POST" class="form-grid">
            <!-- Usuário / E-mail -->
            <div class="form-group">
                <label for="username">E-mail</label>
                <input type="text" id="username" name="email" placeholder="Seu email" required autofocus />
            </div>

            <!-- Senha -->
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="senha" placeholder="Sua senha" required />
            </div>

            <!-- Botão de Ação -->
            <div class="form-actions form-actions-stacked">
                <button type="submit" class="btn btn-primary btn-block">Entrar</button>
            </div>
        </form>
    </section>
</div>
